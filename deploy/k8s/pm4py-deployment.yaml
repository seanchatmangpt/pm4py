# PM4Py API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm4py-api
  namespace: pm4py
  labels:
    app: pm4py
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pm4py
      component: api
  template:
    metadata:
      labels:
        app: pm4py
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: pm4py
        image: pm4py/pm4py:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: PM4PY_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: pm4py-config
              key: PM4PY_LOG_LEVEL
        - name: PM4PY_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: pm4py-config
              key: PM4PY_DB_HOST
        - name: PM4PY_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: pm4py-config
              key: PM4PY_DB_PORT
        - name: PM4PY_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: pm4py-config
              key: PM4PY_DB_NAME
        - name: PM4PY_DB_USER
          valueFrom:
            configMapKeyRef:
              name: pm4py-config
              key: PM4PY_DB_USER
        - name: PM4PY_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pm4py-secret
              key: POSTGRES_PASSWORD
        - name: PM4PY_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: pm4py-config
              key: PM4PY_REDIS_HOST
        - name: PM4PY_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: pm4py-config
              key: PM4PY_REDIS_PORT
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: pm4py-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: pm4py-config
              key: OTEL_SERVICE_NAME
        - name: OTEL_DEPLOYMENT_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: pm4py-config
              key: OTEL_DEPLOYMENT_ENVIRONMENT
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
# PM4Py API Service
apiVersion: v1
kind: Service
metadata:
  name: pm4py-api
  namespace: pm4py
  labels:
    app: pm4py
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: pm4py
    component: api
---
# PM4Py API HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pm4py-api-hpa
  namespace: pm4py
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pm4py-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
# PM4Py API PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pm4py-api-pdb
  namespace: pm4py
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: pm4py
      component: api
