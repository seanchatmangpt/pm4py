name: SaaS SDK CI

on:
  push:
    branches: [main, release]
    paths:
      - 'pm4wasm/js/saas-sdk/**'
  pull_request:
    branches: [main, release]
    paths:
      - 'pm4wasm/js/saas-sdk/**'

jobs:
  test-sdk:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: pm4wasm/js/saas-sdk
        run: npm ci

      - name: Type check
        working-directory: pm4wasm/js/saas-sdk
        run: npm run build

      - name: Run tests
        working-directory: pm4wasm/js/saas-sdk
        run: npm test

  publish-sdk:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test-sdk
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: pm4wasm/js/saas-sdk
        run: npm ci

      - name: Build
        working-directory: pm4wasm/js/saas-sdk
        run: npm run build

      - name: Publish to npm
        working-directory: pm4wasm/js/saas-sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
