name: SaaS Server CI

on:
  push:
    branches: [main, release]
    paths:
      - 'pm4wasm/server/**'
  pull_request:
    branches: [main, release]
    paths:
      - 'pm4wasm/server/**'

jobs:
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pm4wasm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: pm4wasm/server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: pm4wasm/server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pm4wasm_test
        run: npx prisma generate

      - name: Run database migrations
        working-directory: pm4wasm/server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pm4wasm_test
        run: npx prisma migrate deploy

      - name: Run TypeScript
        working-directory: pm4wasm/server
        run: npm run build

      - name: Run tests
        working-directory: pm4wasm/server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pm4wasm_test
          JWT_ACCESS_SECRET: test-access-secret-key-for-testing-purposes
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-purposes
        run: npm test

      - name: Lint
        working-directory: pm4wasm/server
        run: npm run lint

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/pm4wasm-saas
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: pm4wasm/server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
