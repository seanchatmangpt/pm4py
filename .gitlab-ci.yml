workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "integration"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

stages:
  - test

variables:
  PM4PY_DEFAULT_ENABLE_VISUALIZATIONS_VIEW: "False"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip
  before_script:
    - mkdir -p "$PIP_CACHE_DIR"
    - apt-get update -y
    - apt-get install -y graphviz
    - pip install -r requirements_stable.txt

test_scripts:
  stage: test
  script:
    - cd tests
    - python execute_tests.py --pipeline
  # If execute_tests.py returns non-zero, job fails.
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "integration"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never
      # This job is run in merge requests

example_scripts:
  stage: test
  script:
    - pip install .
    - cd examples
    - python execute_everything.py --pipeline
  # If execute_everything.py returns non-zero, job fails.
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "integration"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never
      # This job is run in merge requests

linting_scripts:
  stage: test
  script:
    - pip install .
    - pip install flake8
    - cd files
    - python flake8_score.py
  # If flake8_score.py returns non-zero, job fails.
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "integration"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never
      # do not run this job in merge requests
