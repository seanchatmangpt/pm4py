workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

stages:
  - test

test_scripts:
  stage: test
  image: python:3.12
  variables:
    PM4PY_DEFAULT_ENABLE_VISUALIZATIONS_VIEW: "False"
  before_script:
    - apt-get update -y
    - apt-get install -y graphviz
    - pip install -r requirements_stable.txt
  script:
    - cd tests
    - python execute_tests.py
  # If execute_tests.py returns non-zero, job fails.
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never
      # This job is run in merge requests

example_scripts:
  stage: test
  image: python:3.12
  variables:
    PM4PY_DEFAULT_ENABLE_VISUALIZATIONS_VIEW: "False"
  before_script:
    - apt-get update -y
    - apt-get install -y graphviz
    - pip install -r requirements_stable.txt
    - pip install .
  script:
    - cd examples
    - python execute_everything.py
  # If execute_everything.py returns non-zero, job fails.
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - when: never
      # do not run this job in merge requests

linting_scripts:
  stage: test
  image: python:3.12
  variables:
    PM4PY_DEFAULT_ENABLE_VISUALIZATIONS_VIEW: "False"
  before_script:
    - apt-get update -y
    - apt-get install -y graphviz
    - pip install -r requirements_stable.txt
    - pip install .
    - pip install flake8
  script:
    - cd files
    - python flake8_score.py
  # If flake8_score.py returns non-zero, job fails.
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - when: never
      # do not run this job in merge requests